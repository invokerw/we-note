[package]
name = "wenote-sync"
version = "0.1.0"
edition = "2021"
[dependencies]
anyhow = "1"
base64 = "0.22"
serde = { version="1", features=["derive"] }
serde_json = "1"
reqwest = { version="0.12", features=["blocking","json","rustls-tls"], default-features=false }
sha2 = "0.10"
walkdir = "2"
fs2 = "0.4"
tempfile = "3"
uuid = { version="1", features=["v4","serde"] }
unicode-normalization = "0.1"
diffy = "0.4"
same-file = "1"
