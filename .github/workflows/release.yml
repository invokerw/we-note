name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  client:
    name: Client (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
            extension: exe
          - platform: macos-universal
            os: macos-latest
            target: universal-apple-darwin
            bundle: dmg
            extension: dmg
          - platform: linux-x64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundle: deb
            extension: deb
          - platform: android-arm64
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: |
          npm ci --prefix ../web
          npm ci
      - if: matrix.platform == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - if: matrix.platform == 'macos-universal'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - if: matrix.platform == 'android-arm64'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - if: matrix.platform == 'android-arm64'
        run: |
          sdkmanager 'platforms;android-36' 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;27.2.12479018'
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          rustup target add aarch64-linux-android
      - name: Set installer version and icons
        run: |
          npm exec -- tauri icon src-tauri/icons/icon.png --output src-tauri/release-icons
          cat > release.json <<JSON
          {
            "version": "${GITHUB_REF_NAME#v}",
            "bundle": {
              "active": true,
              "publisher": "WeNote",
              "macOS": { "signingIdentity": "-" },
              "shortDescription": "WeNote desktop client",
              "icon": ["release-icons/128x128.png", "release-icons/icon.icns", "release-icons/icon.ico"]
            }
          }
          JSON
          mkdir -p ../../release-assets
      - name: Build desktop installer
        if: matrix.platform != 'android-arm64'
        env:
          TARGET: ${{ matrix.target }}
          BUNDLE: ${{ matrix.bundle }}
          EXT: ${{ matrix.extension }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          npm exec -- tauri build --ci --config release.json --target "$TARGET" --bundles "$BUNDLE" -- --locked
          cp ../../target/"$TARGET"/release/bundle/"$BUNDLE"/*."$EXT" "../../release-assets/WeNote-$GITHUB_REF_NAME-$PLATFORM.$EXT"
      - name: Build release APK
        if: matrix.platform == 'android-arm64'
        run: |
          npm exec -- tauri android build --ci --apk --target aarch64 --config release.json
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/*-unsigned.apk "../../release-assets/WeNote-$GITHUB_REF_NAME-android-arm64-unsigned.apk"
      - name: Sign APK when a release keystore is configured
        if: matrix.platform == 'android-arm64'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE" ]]; then exit 0; fi
          umask 077
          keyfile="$RUNNER_TEMP/release.keystore"
          trap 'rm -f "$keyfile"' EXIT
          printf '%s' "$KEYSTORE" | base64 --decode > "$keyfile"
          signer="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          apk="../../release-assets/WeNote-$GITHUB_REF_NAME-android-arm64"
          "$signer" sign --ks "$keyfile" --ks-key-alias "$KEY_ALIAS" --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD --v4-signing-enabled false --out "$apk.apk" "$apk-unsigned.apk"
          "$signer" verify "$apk.apk"
          rm "$apk-unsigned.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: client-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error

  server:
    name: Server image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
      - id: image
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.ref }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
      - name: Check API and bundled web app
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          docker run --detach --name wenote --publish 127.0.0.1:8080:8080 "$IMAGE"
          trap 'docker logs wenote; docker rm -fv wenote' EXIT
          curl -fsS --retry 10 --retry-connrefused http://127.0.0.1:8080/healthz | jq -e '.status == "ok"'
          curl -fsS http://127.0.0.1:8080/ | grep -q '<title>WeNote'

  release:
    name: Publish GitHub Release
    needs: [client, server]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: client-*
          path: release-assets
          merge-multiple: true
      - name: Publish installers and image reference
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.server.outputs.image }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "WeNote $GITHUB_REF_NAME" --generate-notes --notes "Docker: \`$IMAGE\`"
          fi
