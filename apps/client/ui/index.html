<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WeNote</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="./entry.js"></script>
    <script type="module" src="../../web/src/desktop.tsx"></script>
  </head>
  <body>
    <main class="auth sync-entry auth-style-paper">
      <div class="cover-panel auth-style-paper" aria-hidden="true">
        <span class="brand">
          <svg class="brand-mark" viewBox="0 0 44 44" aria-hidden="true">
            <path class="brand-mark-back" d="M12 6h15l7 7v22a3 3 0 0 1-3 3H12a3 3 0 0 1-3-3V9a3 3 0 0 1 3-3Z" />
            <path class="brand-mark-front" d="M18 10h11l7 7v18a3 3 0 0 1-3 3H18a3 3 0 0 1-3-3V13a3 3 0 0 1 3-3Z" />
            <path class="brand-mark-fold" d="M29 10v7h7" />
            <path class="brand-mark-line" d="M21 24h8M21 29h6" />
            <path class="brand-mark-spark" d="m10 12 1.1 2.4L13.5 15l-2.4 1.1L10 18.5l-1.1-2.4L6.5 15l2.4-1.1L10 12Z" />
          </svg>
          <span>WeNote</span>
        </span>
        <div class="cover-copy">
          <p class="cover-kicker">CLEAR · KEEP</p>
          <h2>从一页笔记
开始</h2>
          <p>记录、整理、回看，让每个想法都有位置。</p>
        </div>
        <div class="cover-art" aria-hidden="true">
          <span class="note-card note-card-back"></span>
          <span class="note-card note-card-middle"></span>
          <span class="note-card note-card-front"><i></i><i></i><i></i></span>
          <span class="cover-orbit cover-orbit-one"></span>
          <span class="cover-orbit cover-orbit-two"></span>
        </div>
      </div>
      <div class="entry-form">
        <div class="auth-style-switcher" aria-label="登录页风格预览">
          <span>风格预览</span>
          <div role="group" aria-label="选择登录页风格">
            <button type="button" aria-pressed="true" data-auth-style="paper">白昼</button>
            <button type="button" aria-pressed="false" data-auth-style="night">黑夜</button>
          </div>
        </div>
        <h1 id="heading">登录 WeNote</h1>
        <p id="network" role="status" hidden>
          当前离线，可以继续编辑本地笔记。
        </p>
        <form id="login">
          <label
            >服务地址<input
              id="origin"
              type="url"
              value="http://localhost:8080"
              required /></label
          ><label
            >邮箱<input
              id="email"
              type="email"
              autocomplete="username"
              required /></label
          ><label
            >密码<input
              id="password"
              type="password"
              autocomplete="current-password"
              required /></label
          ><button class="primary">登录</button>
        </form>
        <section id="storage-setup" hidden>
          <p id="storage-description"></p>
          <button type="button" class="primary" id="pick-storage" hidden>选择文件夹…</button>
          <button type="button" id="create-separate" hidden>在所选位置新建专用文件夹</button>
          <button type="button" id="retry-sync" hidden>重试未完成的笔记库</button>
          <button type="button" id="ready-editor" hidden>打开已就绪的笔记库</button>
          <label id="mac-auto-label" hidden><input type="checkbox" id="mac-auto" /> 每 15 秒自动同步</label>
          <button type="button" id="mac-logout">退出账号</button>
        </section>
        <form id="settings" hidden>
          <label>笔记库<select id="vault"></select></label
          ><label id="folder-label"
            >本地笔记目录<input
              id="root"
              required
              placeholder="输入已有目录的完整路径" /></label
          ><label class="checkbox"
            ><input type="checkbox" id="auto" /> 应用打开时每 15 秒同步</label
          ><label id="background-label" hidden
            ><input type="checkbox" id="background" /> Android 后台同步</label
          ><button>立即同步</button
          ><button type="button" id="logout">退出账户</button>
        </form>
        <details hidden id="device-panel">
          <summary>设备与同步诊断</summary>
          <button type="button" id="devices">查看已注册设备</button>
          <ul id="device-list"></ul>
          <output id="diagnostic"></output>
        </details>
        <button type="button" hidden id="open-editor">打开本地编辑器</button>
        <output id="status" aria-live="polite"></output>
      </div>
    </main>
    <div id="desktop-editor"></div>
  </body>
</html>
