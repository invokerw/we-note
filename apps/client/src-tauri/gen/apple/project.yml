name: wenote-desktop
options:
  deploymentTarget:
    iOS: '16.0'
configs:
  debug: debug
  release: release
targets:
  wenote-desktop_iOS:
    type: application
    platform: iOS
    sources:
      - Sources
      - Assets.xcassets
      - LaunchScreen.storyboard
    scheme: {}
    settings:
      base:
        PRODUCT_NAME: WeNote
        PRODUCT_BUNDLE_IDENTIFIER: com.wenote.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: '1'
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
        LIBRARY_SEARCH_PATHS[arch=arm64]: '$(inherited) "$(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION)" $(SDKROOT)/usr/lib/swift $(TOOLCHAIN_DIR)/usr/lib/swift/$(PLATFORM_NAME)'
    info:
      path: wenote-desktop_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: '0.1.0'
        CFBundleVersion: '1'
    entitlements:
      path: wenote-desktop_iOS/wenote-desktop_iOS.entitlements
    dependencies:
      - framework: libapp.a
        embed: false
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
    preBuildScripts:
      - name: Build Rust Code
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          cd "$SRCROOT/../../.."
          ./node_modules/.bin/tauri ios xcode-script --platform "$PLATFORM_DISPLAY_NAME" --sdk-root "$SDKROOT" --framework-search-paths "$FRAMEWORK_SEARCH_PATHS" --header-search-paths "${HEADER_SEARCH_PATHS:-}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration "$CONFIGURATION" $ARCHS
        outputFiles:
          - $(SRCROOT)/Externals/arm64/$(CONFIGURATION)/libapp.a
